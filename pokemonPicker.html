<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Picker</title>
    <link rel="stylesheet" href="style/styles.css">
    <script src="JS/main.js"></script>
</head>
<body>
<div class="container">

<header>
    <img src="images/pokemonLogo.svg" alt="Pokemon Logo">
</header>

<main>
<div class="widgets">
    Name a Pokemon!
    <input id="searchterm" type="text" size="10" maxlength="20">
</div>

<div class="widgets">
	First Type 
	<select id="type1">
		<option value="None" >None</option>
		<option value="Normal" >Normal</option>
		<option value="Fire">Fire</option>
		<option value="Water">Water</option>
		<option value="Grass">Grass</option>
        <option value="Electric" >Electric</option>
		<option value="Ice" >Ice</option>
		<option value="Fighting">Fighting</option>
		<option value="Poison">Poison</option>
		<option value="Ground">Ground</option>
        <option value="Flying" >Flying</option>
		<option value="Psychic" >Psychic</option>
		<option value="Bug">Bug</option>
		<option value="Rock">Rock</option>
		<option value="Ghost">Ghost</option>
        <option value="Dragon" >Dragon</option>
		<option value="Dak">Dark</option>
		<option value="Steel">Steel</option>
		<option value="Fairy">Fairy</option>
	</select>
</div>

<div class="widgets">
	Second Type 
	<select id="type2">
		<option value="None" selected>None</option>
		<option value="Normal" >Normal</option>
		<option value="Fire">Fire</option>
		<option value="Water">Water</option>
		<option value="Grass">Grass</option>
        <option value="Electric" >Electric</option>
		<option value="Ice" >Ice</option>
		<option value="Fighting">Fighting</option>
		<option value="Poison">Poison</option>
		<option value="Ground">Ground</option>
        <option value="Flying" >Flying</option>
		<option value="Psychic" >Psychic</option>
		<option value="Bug">Bug</option>
		<option value="Rock">Rock</option>
		<option value="Ghost">Ghost</option>
        <option value="Dragon" >Dragon</option>
		<option value="Dak">Dark</option>
		<option value="Steel">Steel</option>
		<option value="Fairy">Fairy</option>
	</select>
</div>

<div class="widgets">
	Generation
	<select id="gen">
        <option value="None">None</option>
		<option value="1">Gen 1</option>
		<option value="2">Gen 2</option>
		<option value="3">Gen 3</option>
		<option value="4">Gen 4</option>
		<option value="5">Gen 5</option>
        <option value="6">Gen 6</option>
		<option value="7">Gen 7</option>
		<option value="8">Gen 8</option>
		<option value="9">Gen 9</option>
	</select>
</div>

<!-- <div class="widgets">
	Number of results 
	<select id="limit">
		<option value="5">5</option>
		<option value="10" selected>10</option>
		<option value="25">25</option>
		<option value="50">50</option>
		<option value="100">100</option>
	</select>
</div> -->

<div class="widgets">
	<button type="button" id="search" class="green"></button>
	<p>Find Pokemon!</p>
</div>
<hr>

<h2>Search Results</h2>
<div id="content">
	<p>No Pokemon To Display!</p>
</div>

<div id="pagecycles">
    <button id="prevButton">Previous</button>
    <button id="nextButton">Next</button>
</div>

</main>
</div>
</body>
</html>
